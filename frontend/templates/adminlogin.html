<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cloth Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-login-page">
    <div class="admin-login-card">
        <div class="admin-logo">
            <h1>Clothing Store - Admin Panel</h1>
        </div>
        <h3>Admin Login</h3>

        <form id="adminLoginForm">
            <input id="adminEmail" type="email" placeholder="Admin Email" required>
            <input id="adminPassword" type="password" placeholder="Password" required>
            <button type="submit">Login to Dashboard</button>
        </form>

        <p id="adminLoginMessage" class="message"></p>
        <a href="/">&larr; Customer Login</a>
    </div>

<script>
const adminForm = document.getElementById("adminLoginForm");
const adminMessage = document.getElementById("adminLoginMessage");

adminForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("adminEmail").value;
    const password = document.getElementById("adminPassword").value;

    try {
        const response = await fetch("/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: password })
        });

        const result = await response.json();

        if (result.success) {
            window.location.href = result.redirect;
        } else {
            adminMessage.textContent = result.message;
        }
    } catch (error) {
        console.error(error);
        adminMessage.textContent = "Unable to connect to server.";
    }
});
</script>
</body>
</html>
