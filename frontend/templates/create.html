<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account &bull; CLOTH STORE</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="auth-split-layout">
        <!-- LEFT EDITORIAL HERO -->
        <div class="auth-hero-pane">
            <div class="auth-brand-badge">
                <div class="auth-brand-logo">CS</div>
                <div class="auth-brand-title">CLOTH STORE</div>
            </div>

            <div class="auth-quote-box">
                <blockquote>
                    &ldquo;Style is a way to say who you are without having to speak.&rdquo;
                </blockquote>
                <div class="auth-quote-author">&mdash; Rachel Zoe</div>
            </div>

            <div class="auth-hero-footer">
                &copy; 2026 CLOTH STORE &bull; Haute Couture &amp; Ready-to-Wear
            </div>
        </div>

        <!-- RIGHT REGISTER FORM -->
        <div class="auth-form-pane">
            <div class="auth-card-inner">
                <div class="auth-header">
                    <h2>Create Account</h2>
                    <p>Join Cloth Store to receive personalized wardrobes and express delivery</p>
                </div>

                <form id="createForm">
                    <div class="auth-input-group">
                        <label for="name">Full Legal Name *</label>
                        <input type="text" id="name" name="name" placeholder="e.g. David Sterling" required>
                    </div>

                    <div class="auth-input-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="form-grid-2">
                        <div class="auth-input-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
                        </div>
                        <div class="auth-input-group">
                            <label for="pincode">Postal / Pincode *</label>
                            <input type="text" id="pincode" name="pincode" placeholder="600001" required>
                        </div>
                    </div>

                    <div class="auth-input-group">
                        <label for="address">Delivery Street Address *</label>
                        <textarea id="address" name="address" rows="2" placeholder="Building, Street, Area" required></textarea>
                    </div>

                    <div class="form-grid-2">
                        <div class="auth-input-group">
                            <label for="password">Password *</label>
                            <input type="password" id="password" name="password" placeholder="Create password" required>
                        </div>
                        <div class="auth-input-group">
                            <label for="confirmPassword">Confirm Password *</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit-btn" style="margin-top: 10px;">
                        <span>Complete Registration</span>
                        <span>&rarr;</span>
                    </button>

                    <p id="message" style="color: #ef4444; font-size: 13.5px; margin-top: 12px; text-align: center;"></p>
                </form>

                <p class="auth-footer-text">
                    Already registered?
                    <a href="/" class="auth-link">Sign in here</a>
                </p>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>
    <script src="{{ url_for('static', filename='javascript.js') }}"></script>
</body>
</html>
